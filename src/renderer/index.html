<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>SmartTrim</title>
    <style>
      :root {
        color-scheme: dark;
        --ground: #14161a;
        --raised: #1c1f25;
        --line: #2b3038;
        --text: #e8eaed;
        --muted: #9aa3ae;
        --accent: #5ac8a8;
        --bad: #f08a7a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 28px 32px 36px;
        background: var(--ground);
        color: var(--text);
        font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      h1 + p {
        margin: 4px 0 26px;
        color: var(--muted);
      }
      section {
        border-top: 1px solid var(--line);
        padding: 20px 0;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      button {
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 8px 15px;
        background: var(--raised);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      button:hover:enabled {
        border-color: #3c434e;
      }
      button:disabled {
        opacity: 0.42;
        cursor: default;
      }
      button.primary {
        border-color: transparent;
        background: var(--accent);
        color: #0d1714;
        font-weight: 600;
      }
      .recording {
        display: flex;
        gap: 14px;
        align-items: center;
      }
      #recordingInfo {
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      #recordingInfo strong {
        color: var(--text);
        font-weight: 600;
      }
      #sourceTracks {
        display: grid;
        gap: 2px;
      }
      #sourceTracks .row,
      #sourceTracks .head {
        display: grid;
        grid-template-columns: 170px 100px 88px 1fr;
        gap: 10px;
        align-items: center;
        padding: 6px 8px;
        border-radius: 6px;
      }
      #sourceTracks .head {
        padding-bottom: 2px;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #sourceTracks .row:hover {
        background: var(--raised);
      }
      #sourceTracks .row label {
        cursor: pointer;
      }
      #sourceTracks .row input {
        cursor: pointer;
      }
      #sourceTracks .row span {
        color: var(--muted);
      }
      #sourceTracks .row select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 6px;
        background: var(--ground);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      button.link {
        margin-top: 8px;
        border: none;
        padding: 0;
        background: none;
        color: var(--accent);
        font-size: 13px;
        text-decoration: underline;
      }
      .hint {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .preset {
        display: grid;
        grid-template-columns: 200px 1fr;
        gap: 14px;
        align-items: center;
        padding: 0 0 14px;
      }
      .preset select {
        max-width: 220px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 7px;
        background: var(--ground);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      .slider {
        display: grid;
        grid-template-columns: 200px 1fr 90px;
        gap: 14px;
        align-items: center;
        padding: 5px 0;
      }
      .slider input {
        width: 100%;
        accent-color: var(--accent);
      }
      .slider output {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .slider small {
        display: block;
        color: var(--muted);
      }
      .actions {
        display: flex;
        gap: 12px;
        align-items: center;
        border-top: 1px solid var(--line);
        padding-top: 20px;
      }
      #status {
        color: var(--muted);
      }
      #status.bad {
        color: var(--bad);
      }
      #result {
        margin: 16px 0 0;
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--raised);
      }
      #result p {
        margin: 0 0 12px;
      }
      #result .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      #result .numbers {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <h1>SmartTrim</h1>
    <p>Findet die Stellen, an denen nichts passiert, und baut daraus ein Premiere-Projekt.</p>

    <section>
      <h2>Aufnahme</h2>
      <div class="recording">
        <button id="chooseRecording">Aufnahme wählen …</button>
        <button id="openProject">Projekt öffnen …</button>
        <div id="recordingInfo">Noch keine Aufnahme gewählt.</div>
      </div>
    </section>

    <section>
      <h2>Tonspuren</h2>
      <div id="sourceTracks"></div>
      <p class="hint" id="sourceTracksHint">Wähle zuerst eine Aufnahme.</p>
    </section>

    <section>
      <h2>Einstellungen</h2>
      <div class="preset">
        <label for="preset">Voreinstellung</label>
        <select id="preset"></select>
      </div>
      <div class="slider">
        <label for="threshold">Lautstärke ab<small>Leiseres gilt als Pause</small></label>
        <input id="threshold" type="range" />
        <output id="thresholdValue"></output>
      </div>
      <div class="slider">
        <label for="margin">Luft an den Schnitten<small>Bleibt vor und nach dem Ton stehen</small></label>
        <input id="margin" type="range" />
        <output id="marginValue"></output>
      </div>
      <div class="slider">
        <label for="deadZone">Pausen entfernen ab<small>Kürzere Pausen bleiben drin</small></label>
        <input id="deadZone" type="range" />
        <output id="deadZoneValue"></output>
      </div>
      <div id="eventSliders" hidden>
        <div class="slider">
          <label for="eventLead">Vorlauf bei Momenten<small>Bleibt vor einem Knall stehen</small></label>
          <input id="eventLead" type="range" />
          <output id="eventLeadValue"></output>
        </div>
        <div class="slider">
          <label for="eventTail">Nachlauf bei Momenten<small>Bleibt danach stehen</small></label>
          <input id="eventTail" type="range" />
          <output id="eventTailValue"></output>
        </div>
      </div>
    </section>

    <div class="actions">
      <button id="cut" class="primary" disabled>Schneiden</button>
      <div id="status"></div>
    </div>

    <div id="result" hidden></div>

    <script type="module" src="./renderer.ts"></script>
  </body>
</html>
