appId: com.schneilight.smarttrim
productName: SmartTrim
directories:
  buildResources: build
  output: release
# Only what the app runs: the three bundles and the manifest. electron-builder adds the runtime dependencies itself
# (onnxruntime-node, electron-updater); onnxruntime-node is named here only to prune its binaries for other systems.
# ffmpeg and the Silero model are not in here — they are downloaded on first run into the user's own folder
# (ADR-0015, ADR-0031).
files:
  - out/**/*
  - package.json
  - node_modules/onnxruntime-node/**/*
  # The ONNX runtime ships a copy for every operating system it supports. A Windows x64 app needs one of them, and
  # the other four are 220 MB of macOS, Linux and ARM libraries.
  - "!node_modules/onnxruntime-node/bin/napi-v6/linux/**"
  - "!node_modules/onnxruntime-node/bin/napi-v6/darwin/**"
  - "!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**"
# The ONNX runtime is a native module and cannot be loaded from inside the asar archive.
asarUnpack:
  - "**/node_modules/onnxruntime-node/**"
win:
  target:
    - target: nsis
      arch:
        - x64
  # The owner's logo as drawn for every size Windows asks for, 16 to 256 px, rather than one large picture scaled down.
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: SmartTrim
  # No spaces: GitHub turns a space in an uploaded file's name into a dot, while latest.yml names the installer with
  # dashes. The two must agree, or every installed SmartTrim finds the update and cannot download it (ADR-0032).
  artifactName: ${productName}-Setup-${version}.${ext}
# Where installed copies look for a newer SmartTrim: the releases of the public repository (ADR-0032). Nothing is
# uploaded by the build itself (`--publish never`); a release is made by hand with the installer, its .blockmap and
# latest.yml from release/.
publish:
  provider: github
  owner: arberlustig
  repo: SmartTrim
